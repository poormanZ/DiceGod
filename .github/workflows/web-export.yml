name: DiceGod Web Export and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export DiceGod for Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and prepare Korean font
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk python3-fonttools
          mkdir -p ./godot/fonts
          FONT_SOURCE="$(fc-match -f '%{file}\n' 'Noto Sans CJK KR:style=Regular' | head -1)"
          test -n "$FONT_SOURCE"
          test -f "$FONT_SOURCE"
          echo "Font source: $FONT_SOURCE"
          python3 - "$FONT_SOURCE" ./godot/fonts/NotoSansKR-Regular.ttf <<'PY'
          import sys
          from fontTools.ttLib import TTFont, TTCollection

          source, target = sys.argv[1], sys.argv[2]

          def names(font):
              out = []
              for record in font['name'].names:
                  if record.nameID in (1, 2, 4, 6):
                      try:
                          out.append(record.toUnicode())
                      except Exception:
                          pass
              return out

          def has_korean(font):
              cmap = set()
              for table in font['cmap'].tables:
                  cmap.update(table.cmap.keys())
              # Representative Hangul syllables + compatibility jamo.
              return any(0xAC00 <= cp <= 0xD7A3 for cp in cmap)

          candidates = []
          try:
              candidates.append(TTFont(source))
          except Exception:
              pass
          if not candidates:
              candidates.extend(TTCollection(source).fonts)

          selected = None
          for font in candidates:
              if has_korean(font):
                  selected = font
                  break

          if selected is None:
              raise SystemExit('No font face containing Hangul syllables was found')

          selected.flavor = None
          selected.save(target)
          print('Created:', target)
          print('Names:', names(selected)[:20])
          print('Hangul glyphs:', sum(0xAC00 <= cp <= 0xD7A3 for table in selected['cmap'].tables for cp in table.cmap))
          PY
          test -s ./godot/fonts/NotoSansKR-Regular.ttf
          file ./godot/fonts/NotoSansKR-Regular.ttf
          fc-scan ./godot/fonts/NotoSansKR-Regular.ttf | head -30

      - name: Clean Godot import cache before font import
        run: |
          set -euo pipefail
          rm -rf ./godot/.godot
          rm -rf ./godot/build/web
          mkdir -p ./godot/build/web
          test -f ./godot/fonts/NotoSansKR-Regular.ttf

      - name: Verify project font resource
        run: |
          set -euo pipefail
          test -f ./godot/fonts/NotoSansKR-Regular.ttf
          test -f ./godot/theme_korean.tres
          grep -q 'res://fonts/NotoSansKR-Regular.ttf' ./godot/theme_korean.tres
          grep -q 'theme/custom="res://theme_korean.tres"' ./godot/project.godot

      - name: Export Godot project to Web
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./godot
          relative_export_path: ./godot/build/web
          archive_output: false
          presets_to_export: Web
          cache: false

      - name: Verify Web build and embedded Korean font
        run: |
          set -euo pipefail
          test -f ./godot/build/web/index.html
          test -f ./godot/build/web/index.pck
          test -s ./godot/build/web/index.pck
          echo "Checking exported PCK for Korean font resource..."
          strings ./godot/build/web/index.pck | grep -q 'NotoSansKR-Regular.ttf'
          echo "Korean font resource is embedded in the Web PCK"
          ls -lah ./godot/build/web

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./godot/build/web

  deploy:
    name: Deploy DiceGod to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DiceGod to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
