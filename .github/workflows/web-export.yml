name: DiceGod Web Export and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export DiceGod for Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Korean font
        run: |
          set -e
          mkdir -p ./godot/fonts
          wget -q -O ./godot/fonts/NotoSansKR-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/notosanskr/static/NotoSansKR-Regular.ttf'
          test -s ./godot/fonts/NotoSansKR-Regular.ttf
          file ./godot/fonts/NotoSansKR-Regular.ttf
          fc-scan ./godot/fonts/NotoSansKR-Regular.ttf | head -20

      - name: Verify project font resource
        run: |
          test -f ./godot/theme_korean.tres
          grep -q 'res://fonts/NotoSansKR-Regular.ttf' ./godot/theme_korean.tres

      - name: Export Godot project to Web
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./godot
          relative_export_path: ./godot/build/web
          archive_output: false
          presets_to_export: Web
          cache: true

      - name: Verify Web build
        run: |
          set -e
          test -f ./godot/build/web/index.html
          test -f ./godot/build/web/index.pck
          ls -lah ./godot/build/web
          grep -q 'NotoSansKR' ./godot/theme_korean.tres

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./godot/build/web

  deploy:
    name: Deploy DiceGod to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DiceGod to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
