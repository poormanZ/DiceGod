name: DiceGod Web Export and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export DiceGod for Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and prepare Korean font
        run: |
          set -euo pipefail
          mkdir -p ./godot/fonts
          curl -L --fail --retry 3 \
            -o ./godot/fonts/NotoSansKR-Regular.ttf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/Variable/TTF/Subset/NotoSansKR-VF.ttf
          test -s ./godot/fonts/NotoSansKR-Regular.ttf
          file ./godot/fonts/NotoSansKR-Regular.ttf
          fc-scan ./godot/fonts/NotoSansKR-Regular.ttf >/dev/null
          echo "Official Noto Sans KR font downloaded: ./godot/fonts/NotoSansKR-Regular.ttf"

      - name: Clean Godot import cache
        run: |
          set -euo pipefail
          rm -rf ./godot/.godot ./godot/build
          mkdir -p ./godot/build

      - name: Verify font configuration
        run: |
          set -euo pipefail
          test -s ./godot/fonts/NotoSansKR-Regular.ttf
          test -f ./godot/theme_korean.tres
          grep -q 'res://fonts/NotoSansKR-Regular.ttf' ./godot/theme_korean.tres
          grep -q 'theme/custom="res://theme_korean.tres"' ./godot/project.godot
          grep -q 'KoreanFontManager="\*res://scripts/ui/korean_font_manager.gd"' ./godot/project.godot

      - name: Download Godot for validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/dicegod
          curl -L --fail --retry 3 -o /tmp/dicegod/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/dicegod/godot.zip -d /tmp/dicegod
          GODOT_BIN="$(find /tmp/dicegod -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Warm up Godot asset import
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path ./godot --quit 2>&1 | tee ./godot_import_warmup.log || true
          echo "Waiting for Godot to finish importing generated resources..."
          for i in $(seq 1 30); do
            if find ./godot/.godot/imported -maxdepth 1 -type f -name 'NotoSansKR-Regular.ttf-*.fontdata' -print -quit 2>/dev/null | grep -q .; then
              echo "Korean font import completed."
              break
            fi
            sleep 1
          done
          test -n "$(find ./godot/.godot/imported -maxdepth 1 -type f -name 'NotoSansKR-Regular.ttf-*.fontdata' -print -quit 2>/dev/null)"

      - name: Validate Godot import
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path ./godot --quit 2>&1 | tee ./godot_import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Could not find|ERROR: Cannot infer|No loader found for resource: res://fonts/NotoSansKR-Regular.ttf|theme_korean.tres:6 - Parse Error|Error loading custom project theme' ./godot_import.log; then
            echo "Godot project import reported errors."
            exit 1
          fi

      - name: Validate actual Godot startup
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path ./godot --script res://scripts/validate_project.gd 2>&1 | tee ./godot_validation.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Could not find|ERROR: Cannot infer|No loader found for resource: res://fonts/NotoSansKR-Regular.ttf|theme_korean.tres:6 - Parse Error|Error loading custom project theme' ./godot_validation.log; then
            echo "Godot startup validation reported errors."
            exit 1
          fi

      - name: Run automated roadmap validation
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path ./godot --script res://scripts/validation/roadmap_validation.gd 2>&1 | tee ./roadmap_validation.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Could not find|ERROR: Cannot infer|No loader found for resource: res://fonts/NotoSansKR-Regular.ttf|theme_korean.tres:6 - Parse Error|Error loading custom project theme|Roadmap validation failed' ./roadmap_validation.log; then
            echo "Roadmap validation reported errors."
            exit 1
          fi

      - name: Export Godot project to Web
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./godot
          relative_export_path: ./godot/build
          archive_output: false
          presets_to_export: Web
          cache: false

      - name: Normalize and validate Web export
        run: |
          set -euo pipefail
          echo "Raw Godot export:"
          find ./godot/build -maxdepth 4 -type f -printf '%p %s bytes\n' | sort
          if [ -d ./godot/build/Web ]; then
            rm -rf ./godot/build/web
            mv ./godot/build/Web ./godot/build/web
          fi
          if [ -d ./godot/build/web/Web ]; then
            rm -rf ./godot/build/web-normalized
            mv ./godot/build/web/Web ./godot/build/web-normalized
            rm -rf ./godot/build/web
            mv ./godot/build/web-normalized ./godot/build/web
          fi
          test -f ./godot/build/web/index.html
          test -s ./godot/build/web/index.html
          test -f ./godot/build/web/index.pck
          test -f ./godot/build/web/index.wasm
          TOTAL_BYTES="$(find ./godot/build/web -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
          test "$TOTAL_BYTES" -gt 0
          echo "Web export verified: ${TOTAL_BYTES} bytes"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./godot/build/web

  deploy:
    name: Deploy DiceGod to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DiceGod to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
