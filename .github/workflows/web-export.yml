name: DiceGod Web Export and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export DiceGod for Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and prepare Korean font
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk python3-fonttools
          mkdir -p ./godot/fonts
          FONT_SOURCE="$(fc-match -f '%{file}\n' 'Noto Sans CJK KR' | head -1)"
          test -n "$FONT_SOURCE"
          test -f "$FONT_SOURCE"
          echo "Font source: $FONT_SOURCE"
          python3 - "$FONT_SOURCE" ./godot/fonts/NotoSansKR-Regular.ttf <<'PY'
          import sys
          from fontTools.ttLib import TTFont, TTCollection

          source = sys.argv[1]
          target = sys.argv[2]

          def family_names(font):
              names = []
              for record in font['name'].names:
                  if record.nameID in (1, 4, 6):
                      try:
                          names.append(record.toUnicode())
                      except Exception:
                          pass
              return names

          selected = None
          try:
              font = TTFont(source)
              names = family_names(font)
              if any('KR' in n or 'Korean' in n for n in names):
                  selected = font
          except Exception:
              pass

          if selected is None:
              collection = TTCollection(source)
              for font in collection.fonts:
                  names = family_names(font)
                  if any('KR' in n or 'Korean' in n for n in names):
                      selected = font
                      break

          if selected is None:
              raise SystemExit('Could not find Korean face in Noto CJK font collection')

          selected.flavor = None
          selected.save(target)
          print('Created:', target)
          print('Names:', family_names(selected)[:10])
          PY
          test -s ./godot/fonts/NotoSansKR-Regular.ttf
          file ./godot/fonts/NotoSansKR-Regular.ttf
          fc-scan ./godot/fonts/NotoSansKR-Regular.ttf | head -20

      - name: Verify project font resource
        run: |
          set -e
          test -f ./godot/fonts/NotoSansKR-Regular.ttf
          test -f ./godot/theme_korean.tres
          grep -q 'res://fonts/NotoSansKR-Regular.ttf' ./godot/theme_korean.tres

      - name: Export Godot project to Web
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./godot
          relative_export_path: ./godot/build/web
          archive_output: false
          presets_to_export: Web
          cache: true

      - name: Verify Web build
        run: |
          set -e
          test -f ./godot/build/web/index.html
          test -f ./godot/build/web/index.pck
          test -s ./godot/fonts/NotoSansKR-Regular.ttf
          ls -lah ./godot/build/web

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./godot/build/web

  deploy:
    name: Deploy DiceGod to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DiceGod to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
